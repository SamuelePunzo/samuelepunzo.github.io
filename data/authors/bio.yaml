    summary: |
      Locating refusal circuits in encoder-free models under the supervision of Alessandro Suglia (University of Edinburgh) and Francesco Pinto (Google DeepMind).
  - role: Visiting Researcher
    org: Max Planck Institute for Informatics (MPI-INF)
    org_short: Max Planck Institute for Informatics
    start: 2026-07-01
    end: 2026-10-31
    summary: |
      Conducted research in the Explainable Machine Learning group with Prof. Jonas Fischer. Explored vision-language models for 3D scenes using sparse autoencoders to extract concepts and identify spatially grounded representations for interpretable downstream tasks.
  - role: Research Assistant
    org: Institute for Logic, Language and Computation (ILLC) — University of Amsterdam
    org_short: ILLC, University of Amsterdam
    start: 2026-01-01
    end: 2026-07-31
    summary: |
      Research in the MULINI Lab with Prof. Sandro Pezzelle. Discovered animacy circuits across four language-model architectures, tested their transferability, and developed a token-level perplexity framework for studying linguistic cues. Contributed to TransformerLens and EAP-ig.
  - role: Research Assistant
    org: BioMedical and Health Informatics Lab — University of Pisa
    org_short: University of Pisa · BioMedical and Health Informatics Lab
    start: 2024-11-01
    end: 2025-11-30
    summary: |
      Worked with Prof. Alina Sîrbu on the MEDICA and PANS projects, developing explainable machine learning pipelines for microarray and single-cell RNA sequencing data to identify biomarkers and pathways using interpretability and biological enrichment analysis.

